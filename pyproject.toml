[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "living-ai-evolution-engine"
version = "0.2.0"
description = "Local-first AI memory, SmolLM3 inference, and reversible evolution engine"
requires-python = ">=3.11"
dependencies = ["litestar[standard]>=2.12,<3", "uvicorn>=0.30", "pydantic>=2.7"]

[project.optional-dependencies]
hf = ["torch>=2.4", "transformers>=4.53.0", "safetensors>=0.4", "accelerate>=0.34"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["living_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
