[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "living-ai-evolution-engine"
version = "0.4.0"
description = "Mobile-first local AI memory, from-scratch language model, safe knowledge import, and reversible evolution"
requires-python = ">=3.11"
dependencies = ["litestar[standard]>=2.12,<3", "uvicorn>=0.30", "pydantic>=2.7"]

[project.optional-dependencies]
neural = ["torch>=2.4"]
litert = ["litert-lm-api", "litert-lm"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["living_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
