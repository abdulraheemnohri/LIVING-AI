name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: living-ai-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python and dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Syntax-check dashboard JavaScript
        run: |
          node --check static/app.js
          node --check static/planner.js
          node --check static/worker.js
          node --check static/tasks.js
          node --check static/evaluation.js
          node --check static/projects.js

      - name: Syntax-check shell scripts
        run: |
          bash -n scripts/install_android_debian.sh
          bash -n scripts/run.sh
          bash -n scripts/train_from_scratch_android.sh
          bash -n scripts/train_hybrid_android.sh
          bash -n scripts/update_android_debian.sh
          bash -n scripts/check_github_updates.sh
          bash -n scripts/enable_autostart.sh
          bash -n scripts/disable_autostart.sh
          bash -n scripts/download_litert_model.sh
          bash -n scripts/start_managed.sh

      - name: Compile Python modules
        run: python -m compileall -q living_ai

      - name: Verify application startup
        run: |
          python -c 'from living_ai.app import app; print("Litestar startup OK: {} routes registered".format(len(app.routes)))'

      - name: Run test suite
        run: python -m pytest -q
