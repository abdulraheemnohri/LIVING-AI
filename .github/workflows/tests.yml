name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q living_ai
      - run: python -c "from living_ai.app import app; print(f'Litestar startup OK: {len(app.routes)} routes registered')"
      - run: python -m pytest -q
